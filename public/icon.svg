<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002244" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1BF00" />
      <stop offset="100%" stop-color="#AA8800" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8102E" />
      <stop offset="100%" stop-color="#880015" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Shield Base Outline -->
  <path d="M 256,64 C 340,64 400,90 400,160 C 400,320 256,430 256,448 C 256,448 112,320 112,160 C 112,90 172,64 256,64 Z" 
        fill="#002D59" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Inner Split: Spanish Red & Gold Accent Bands -->
  <path d="M 256,80 C 330,80 380,105 380,165 C 380,305 256,410 256,424 C 256,424 132,305 132,165 C 132,105 182,80 256,80 Z" 
        fill="#002244" />

  <!-- Scale of Justice / Balanza de la Ley Tributaria -->
  <g transform="translate(256, 250) scale(1.15)">
    <!-- Central Pillar -->
    <rect x="-6" y="-120" width="12" height="150" rx="4" fill="url(#goldGrad)" />
    <!-- Crown top -->
    <polygon points="0,-140 -20,-120 20,-120" fill="url(#goldGrad)" />
    <!-- Beam -->
    <rect x="-100" y="-105" width="200" height="8" rx="4" fill="url(#goldGrad)" />
    <!-- Left Plate -->
    <line x1="-85" y1="-100" x2="-105" y2="-40" stroke="#F1BF00" stroke-width="3" />
    <line x1="-85" y1="-100" x2="-65" y2="-40" stroke="#F1BF00" stroke-width="3" />
    <path d="M -120,-40 Q -85,-15 -50,-40 Z" fill="url(#goldGrad)" />
    <!-- Right Plate -->
    <line x1="85" y1="-100" x2="65" y2="-40" stroke="#F1BF00" stroke-width="3" />
    <line x1="85" y1="-100" x2="105" y2="-40" stroke="#F1BF00" stroke-width="3" />
    <path d="M 50,-40 Q 85,-15 120,-40 Z" fill="url(#goldGrad)" />
    <!-- Base -->
    <path d="M -40,30 Q 0,20 40,30 L 45,45 L -45,45 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Typography initials: AEAT -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">AEAT</text>
  <text x="256" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#F1BF00" text-anchor="middle" letter-spacing="3">C2 · C1</text>
</svg>
